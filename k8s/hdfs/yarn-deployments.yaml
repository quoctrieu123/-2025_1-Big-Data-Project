---
# YARN ResourceManager Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yarn-resourcemanager
  namespace: bigdata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yarn-resourcemanager
  template:
    metadata:
      labels:
        app: yarn-resourcemanager
    spec:
      containers:
        - name: yarn-resourcemanager
          image: apache/hadoop:3
          command: ["yarn", "resourcemanager"]
          ports:
            - containerPort: 8088
              name: web
            - containerPort: 8030
              name: scheduler
            - containerPort: 8031
              name: res-tracker
            - containerPort: 8032
              name: client
            - containerPort: 8033
              name: admin
          envFrom:
            - configMapRef:
                name: hadoop-config
          volumeMounts:
            - name: hadoop-config
              mountPath: /opt/hadoop/etc/hadoop/core-site.xml
              subPath: core-site.xml
            - name: hadoop-config
              mountPath: /opt/hadoop/etc/hadoop/hdfs-site.xml
              subPath: hdfs-site.xml
            - name: hadoop-config
              mountPath: /opt/hadoop/etc/hadoop/yarn-site.xml
              subPath: yarn-site.xml
            - name: hadoop-config
              mountPath: /opt/hadoop/etc/hadoop/mapred-site.xml
              subPath: mapred-site.xml
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 2Gi
      volumes:
        - name: hadoop-config
          configMap:
            name: hadoop-config-files
---
# YARN NodeManager Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yarn-nodemanager
  namespace: bigdata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yarn-nodemanager
  template:
    metadata:
      labels:
        app: yarn-nodemanager
    spec:
      containers:
        - name: yarn-nodemanager
          image: apache/hadoop:3
          command: ["yarn", "nodemanager"]
          ports:
            - containerPort: 8042
              name: web
          envFrom:
            - configMapRef:
                name: hadoop-config
          volumeMounts:
            - name: hadoop-data
              mountPath: /tmp/hadoop-yarn
            - name: hadoop-config
              mountPath: /opt/hadoop/etc/hadoop/core-site.xml
              subPath: core-site.xml
            - name: hadoop-config
              mountPath: /opt/hadoop/etc/hadoop/hdfs-site.xml
              subPath: hdfs-site.xml
            - name: hadoop-config
              mountPath: /opt/hadoop/etc/hadoop/yarn-site.xml
              subPath: yarn-site.xml
            - name: hadoop-config
              mountPath: /opt/hadoop/etc/hadoop/mapred-site.xml
              subPath: mapred-site.xml
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 2Gi
      volumes:
        - name: hadoop-data
          emptyDir: {}
        - name: hadoop-config
          configMap:
            name: hadoop-config-files
