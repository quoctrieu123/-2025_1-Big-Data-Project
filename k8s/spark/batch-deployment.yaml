apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-batch
  namespace: bigdata
  labels:
    app: spark-batch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-batch
  template:
    metadata:
      labels:
        app: spark-batch
    spec:
      containers:
        - name: spark-batch
          image: spark-consumer:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for HDFS and MongoDB..."
              sleep 5
              echo "Starting batch processing loop..."
              while true; do
                echo "=== Starting batch job at $(date) ==="
                /opt/spark/bin/spark-submit \
                  --master local[*] \
                  --driver-memory 4g \
                  --packages org.mongodb.spark:mongo-spark-connector_2.12:10.3.0 \
                  /app/consumer/write-to-mongodb.py || echo "Batch job failed, retrying in 5 minutes..."
                echo "Sleeping for 3 hours before next run..."
                sleep 10800
              done
          envFrom:
            - configMapRef:
                name: spark-batch-config
          resources:
            requests:
              cpu: 100m
              memory: 2Gi
            limits:
              cpu: 1000m
              memory: 6Gi
          volumeMounts:
            - name: script-volume
              mountPath: /app/consumer/write-to-mongodb.py
              subPath: write-to-mongodb.py
      volumes:
        - name: script-volume
          configMap:
            name: spark-batch-script
      restartPolicy: Always